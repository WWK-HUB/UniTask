# Activate only behind an HTTPS reverse proxy. Use a dedicated database and upload directory.
spring:
  servlet:
    multipart:
      max-file-size: 90MB
      max-request-size: 94MB
server:
  tomcat:
    max-swallow-size: 94MB
  servlet:
    session:
      cookie:
        secure: true
unitask:
  auth:
    registration-code: ${UNITASK_REGISTRATION_CODE:}
  files:
    max-file-bytes: 94371840
    max-batch-bytes: 94371840
