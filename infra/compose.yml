services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: unitask
      MYSQL_USER: unitask
      MYSQL_PASSWORD: ${UNITASK_DB_PASSWORD:?Set UNITASK_DB_PASSWORD in infra/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
      TZ: UTC
    ports:
      - "127.0.0.1:${UNITASK_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${UNITASK_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql_data:
